version: "3.8"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: venom_bot
    volumes:
      - .:/app
    working_dir: /app
    command: python bot.py
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - BGUTIL_PROVIDER_URL=http://bgutil:4416
    depends_on:
      - bgutil
    restart: always

  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil_provider
    ports:
      - "4416:4416"
    restart: always